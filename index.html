<!DOCTYPE html>
<html lang="tr">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zindan Şövalyesi</title></head>
<body style="margin:0;background:#090a0f;color:#fff;font-family:sans-serif;overflow:hidden">
<div id="ui" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#090a0f;z-index:9">
  <h1 style="color:#f59e0b">⚔️ ZİNDAN ŞÖVALYESİ</h1>
  <button id="btn" style="padding:16px 40px;font-size:20px;background:#d97706;color:#fff;border:0;border-radius:10px;cursor:pointer">ZİNDANA GİR</button>
</div>
<canvas id="c"></canvas>
<script>
const c=document.getElementById("c"),x=c.getContext("2d");let W=c.width=innerWidth,H=c.height=innerHeight;
let p={x:0,y:0,hp:100,s:220,l:1,xp:0,nx:6,fr:.5,ft:0,d:25,m:1},en=[],bu=[],ge=[],k={},t=0,lt=0,st=0,kl=0,run=0;
onkeydown=e=>k[e.key.toLowerCase()]=1;onkeyup=e=>k[e.key.toLowerCase()]=0;
document.getElementById("btn").onclick=()=>{document.getElementById("ui").style.display="none";run=1;lt=performance.now();requestAnimationFrame(lp)};
function lp(n){if(!run)return;let dt=Math.min(.05,(n-lt)/1e3);lt=n;t+=dt;
let mx=(k.d||k.arrowright?1:0)-(k.a||k.arrowleft?1:0),my=(k.s||k.arrowdown?1:0)-(k.w||k.arrowup?1:0),ln=Math.hypot(mx,my);
if(ln){p.x+=mx/ln*p.s*dt;p.y+=my/ln*p.s*dt}
if((st-=dt)<=0){let a=Math.random()*6.28,d=Math.max(W,H)*.6;en.push({x:p.x+Math.cos(a)*d,y:p.y+Math.sin(a)*d,hp:30+t*.5});st=Math.max(.25,1-t*.01)}
if((p.ft-=dt)<=0&&en.length){let nr=en.reduce((a,b)=>Math.hypot(b.x-p.x,b.y-p.y)<Math.hypot(a.x-p.x,a.y-p.y)?b:a),ba=Math.atan2(nr.y-p.y,nr.x-p.x);
for(let i=0;i<p.m;i++){let a=ba+(i-(p.m-1)/2)*.2;bu.push({x:p.x,y:p.y,vx:Math.cos(a)*500,vy:Math.sin(a)*500,l:1})}p.ft=p.fr}
bu.forEach((b,i)=>{b.x+=b.vx*dt;b.y+=b.vy*dt;b.l-=dt;en.forEach(e=>{if(Math.hypot(b.x-e.x,b.y-e.y)<20){e.hp-=p.d;b.l=0}});if(b.l<=0)bu.splice(i,1)});
for(let i=en.length-1;i>=0;i--){let e=en[i],a=Math.atan2(p.y-e.y,p.x-e.x);e.x+=Math.cos(a)*95*dt;e.y+=Math.sin(a)*95*dt;
if(Math.hypot(p.x-e.x,p.y-e.y)<28){p.hp-=15*dt;if(p.hp<=0){alert("OYUN BİTTİ! Skor: "+kl);location.reload();return}}
if(e.hp<=0){kl++;ge.push({x:e.x,y:e.y});en.splice(i,1)}}
for(let i=ge.length-1;i>=0;i--){let g=ge[i],d=Math.hypot(p.x-g.x,p.y-g.y);if(d<130){let a=Math.atan2(p.y-g.y,p.x-g.x);g.x+=Math.cos(a)*350*dt;g.y+=Math.sin(a)*350*dt}
if(d<24){ge.splice(i,1);if(++p.xp>=p.nx){p.xp=0;p.l++;p.nx=Math.round(p.nx*1.3);let u=prompt("SEVİYE "+p.l+"! Seç:\n1: +1 Hançer\n2: Hasar +%30\n3: Hız +%25","1");if(u=="1")p.m++;else if(u=="2")p.d*=1.3;else p.fr*=.75;lt=performance.now()}}}
x.fillStyle="#0b0d14";x.fillRect(0,0,W,H);x.save();x.translate(W/2-p.x,H/2-p.y);
x.fillStyle="#10b981";ge.forEach(g=>{x.beginPath();x.arc(g.x,g.y,5,0,6.28);x.fill()});
x.fillStyle="#94a3b8";en.forEach(e=>{x.beginPath();x.arc(e.x,e.y,14,0,6.28);x.fill()});
x.fillStyle="#38bdf8";bu.forEach(b=>{x.beginPath();x.arc(b.x,b.y,5,0,6.28);x.fill()});
x.fillStyle="#f59e0b";x.beginPath();x.arc(p.x,p.y,16,0,6.28);x.fill();
x.restore();x.fillStyle="#fff";x.font="bold 16px sans-serif";x.fillText("Sv."+p.l+" | Can:"+Math.ceil(p.hp)+" | Skor:"+kl,16,28);
requestAnimationFrame(lp)}
</script>
</body>
</html>
