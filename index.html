<!DOCTYPE html>
<html lang="tr">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Zindan Şövalyesi</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none}body{background:#111810;color:#fff;font-family:'Segoe UI',sans-serif;overflow:hidden;touch-action:none}
canvas{display:block;width:100vw;height:100vh}
#hud{position:fixed;top:0;left:0;width:100%;padding:10px 14px;pointer-events:none;z-index:10}
.bar-row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:800;font-size:14px;text-shadow:0 2px 3px #000}
.pill{background:rgba(15,23,42,.88);border:2px solid #475569;padding:4px 12px;border-radius:12px}
.hp-box{flex:1;max-width:180px;height:16px;background:#1e293b;border:2px solid #0f172a;border-radius:8px;overflow:hidden;position:relative}
#hp-fill{height:100%;width:100%;background:linear-gradient(90deg,#dc2626,#ef4444)}
.xp-box{width:100%;height:8px;background:#0f172a;border-radius:6px;margin-top:6px;overflow:hidden}
#xp-fill{height:100%;width:0%;background:linear-gradient(90deg,#10b981,#34d399)}
.ov{position:fixed;inset:0;background:rgba(8,12,10,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;z-index:50;text-align:center}
.hid{display:none!important}
.btn{background:linear-gradient(180deg,#f59e0b,#b45309);border:2px solid #fef08a;color:#fff;padding:15px 38px;font-size:19px;font-weight:900;border-radius:14px;cursor:pointer;box-shadow:0 6px 0 #78350f}
.cards{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:16px}
.card{background:linear-gradient(180deg,#1e293b,#0f172a);border:2px solid #f59e0b;border-radius:14px;padding:16px;width:185px;cursor:pointer}
</style></head>
<body>
<div id="hud">
  <div class="bar-row">
    <div class="pill" id="lv">⭐ Lv.1</div>
    <div class="hp-box"><div id="hp-fill"></div></div>
    <div class="pill" id="rd">Round 1</div>
    <div class="pill" id="sc">💀 0</div>
  </div>
  <div class="xp-box"><div id="xp-fill"></div></div>
</div>
<div id="start" class="ov">
  <h1 style="font-size:36px;color:#fbbf24;text-shadow:0 4px 0 #78350f;margin-bottom:8px">⚔️ ZİNDAN ŞÖVALYESİ</h1>
  <p style="color:#cbd5e1;margin-bottom:22px;max-width:360px">Destansı boss savaşları, büyü patlamaları ve efsanevi yeteneklerle arenada hayatta kal!</p>
  <button class="btn" id="go">SAVAŞA BAŞLA</button>
</div>
<div id="lvlup" class="ov hid"><h2 style="color:#fbbf24;font-size:28px">✨ YETENEK SEÇ</h2><div class="cards" id="cbox"></div></div>
<canvas id="c"></canvas>
<script>
const c=document.getElementById("c"),x=c.getContext("2d");let W=c.width=innerWidth,H=c.height=innerHeight;
onresize=()=>{W=c.width=innerWidth;H=c.height=innerHeight};
let p,en=[],bu=[],ge=[],pt=[],ft=[],k={},joy={a:0,sx:0,sy:0,dx:0,dy:0},t=0,lt=0,st=0,bt=0,kl=0,run=0,anim=0;
const U=[
  {id:"m",ic:"🗡️",t:"Çoklu Kılıç",d:"+1 Ekstra Enerji Kılıcı"},
  {id:"s",ic:"⚡",t:"Hızlı Saldırı",d:"Saldırı Hızı +%25"},
  {id:"d",ic:"🔥",t:"Ejderha Gücü",d:"Hasar +%35"},
  {id:"a",ic:"🌀",t:"Zümrüt Fırtına",d:"Etrafında dönen yeşil aura"},
  {id:"h",ic:"🧪",t:"Yaşam İksiri",d:"+40 Max Can & İyileşme"}
];
onkeydown=e=>k[e.key.toLowerCase()]=1;onkeyup=e=>k[e.key.toLowerCase()]=0;
c.ontouchstart=e=>{let q=e.touches.item(0);if(q){joy={a:1,sx:q.clientX,sy:q.clientY,dx:0,dy:0}}};
c.ontouchmove=e=>{let q=e.touches.item(0);if(joy.a&&q){let vx=q.clientX-joy.sx,vy=q.clientY-joy.sy,d=Math.hypot(vx,vy);if(d>0){let cl=Math.min(d,45);joy.dx=vx/d*(cl/45);joy.dy=vy/d*(cl/45)}}};
c.ontouchend=()=>joy.a=0;

function drawHero(hx,hy,dir){
  x.save();x.translate(hx,hy);
  x.fillStyle="rgba(0,0,0,.35)";x.beginPath();x.ellipse(0,18,16,7,0,0,6.28);x.fill();
  x.fillStyle="#dc2626";x.beginPath();x.moveTo(-10,-4);x.lineTo(-18,16);x.lineTo(18,16);x.lineTo(10,-4);x.fill();
  x.fillStyle="#334155";x.beginPath();x.arc(0,4,13,0,6.28);x.fill();
  x.fillStyle="#fed7aa";x.beginPath();x.arc(0,-8,11,0,6.28);x.fill();
  x.fillStyle="#94a3b8";x.beginPath();x.arc(0,-11,12,3.14,6.28);x.fill();
  x.fillStyle="#f59e0b";x.fillRect(-12,-12,24,4);
  x.fillStyle="#0f172a";x.fillRect(-5,-8,3,4);x.fillRect(3,-8,3,4);
  x.rotate(dir);x.fillStyle="#e2e8f0";x.fillRect(10,-3,22,6);x.fillStyle="#fbbf24";x.fillRect(8,-7,4,14);
  x.restore();
}

function drawMob(e){
  x.save();x.translate(e.x,e.y);
  let s=e.b?2.2:1;x.scale(s,s);
  x.fillStyle="rgba(0,0,0,.35)";x.beginPath();x.ellipse(0,16,14,6,0,0,6.28);x.fill();
  x.fillStyle=e.b?"#1e293b":"#3f6212";x.beginPath();x.arc(0,0,14,0,6.28);x.fill();
  x.strokeStyle=e.b?"#38bdf8":"#1a2e05";x.lineWidth=2;x.stroke();
  x.fillStyle=e.b?"#38bdf8":"#ef4444";x.fillRect(-6,-4,4,4);x.fillRect(2,-4,4,4);
  if(e.b){x.strokeStyle="#38bdf8";x.beginPath();x.arc(0,3,5,0,6.28);x.stroke();}
  else{x.fillStyle="#fef08a";x.beginPath();x.moveTo(-10,-10);x.lineTo(-14,-18);x.lineTo(-5,-12);x.fill();x.beginPath();x.moveTo(10,-10);x.lineTo(14,-18);x.lineTo(5,-12);x.fill();}
  x.restore();
  if(e.b){x.fillStyle="#0f172a";x.fillRect(e.x-32,e.y-42,64,7);x.fillStyle="#ef4444";x.fillRect(e.x-32,e.y-42,64*(e.hp/e.mhp),7);}
}

document.getElementById("go").onclick=()=>{
  document.getElementById("start").classList.add("hid");
  p={x:0,y:0,hp:100,mhp:100,s:220,l:1,xp:0,nx:8,fr:.55,ft:0,d:28,m:1,au:0,dir:0};
  en=[];bu=[];ge=[];pt=[];ft=[];t=0;st=0;bt=0;kl=0;run=1;lt=performance.now();requestAnimationFrame(lp);
};

function lvlMenu(){
  run=0;const b=document.getElementById("cbox");b.innerHTML="";
  U.slice().sort(()=>Math.random()-.5).slice(0,3).forEach(u=>{
    let d=document.createElement("div");d.className="card";
    d.innerHTML=`<div style="font-size:32px">${u.ic}</div><h3 style="color:#fbbf24;margin:6px 0">${u.t}</h3><p style="font-size:13px;color:#cbd5e1">${u.d}</p>`;
    d.onclick=()=>{if(u.id=="m")p.m++;if(u.id=="s")p.fr*=.75;if(u.id=="d")p.d*=1.35;if(u.id=="a")p.au++;if(u.id=="h"){p.mhp+=40;p.hp=p.mhp;}
    document.getElementById("lvlup").classList.add("hid");run=1;lt=performance.now();requestAnimationFrame(lp)};
    b.appendChild(d);
  });
  document.getElementById("lvlup").classList.remove("hid");
}

function lp(n){
  if(!run)return;let dt=Math.min(.05,(n-lt)/1e3);lt=n;t+=dt;anim+=dt*8;
  let mx=joy.a?joy.dx:(k.d||k.arrowright?1:0)-(k.a||k.arrowleft?1:0);
  let my=joy.a?joy.dy:(k.s||k.arrowdown?1:0)-(k.w||k.arrowup?1:0);
  let ln=Math.hypot(mx,my);if(ln){p.x+=mx/Math.max(1,ln)*p.s*dt;p.y+=my/Math.max(1,ln)*p.s*dt;p.dir=Math.atan2(my,mx);}
  if((st-=dt)<=0){let a=Math.random()*6.28,d=Math.max(W,H)*.6;en.push({x:p.x+Math.cos(a)*d,y:p.y+Math.sin(a)*d,r:16,hp:35+t*.7,mhp:35+t*.7,sp:95,b:0});st=Math.max(.25,1-t*.01)}
  if((bt+=dt)>=35){bt=0;let a=Math.random()*6.28,d=Math.max(W,H)*.6;en.push({x:p.x+Math.cos(a)*d,y:p.y+Math.sin(a)*d,r:34,hp:500+t*6,mhp:500+t*6,sp:65,b:1});ft.push({x:p.x,y:p.y-50,tx:"⚠️ TAŞ GOLEM BOSS!",c:"#38bdf8",l:1.5})}
  if((p.ft-=dt)<=0&&en.length){
    let nr=en.reduce((a,b)=>Math.hypot(b.x-p.x,b.y-p.y)<Math.hypot(a.x-p.x,a.y-p.y)?b:a);
    if(Math.hypot(nr.x-p.x,nr.y-p.y)<520){
      let ba=Math.atan2(nr.y-p.y,nr.x-p.x);p.dir=ba;
      for(let i=0;i<p.m;i++){let a=ba+(i-(p.m-1)/2)*.18;bu.push({x:p.x,y:p.y,vx:Math.cos(a)*540,vy:Math.sin(a)*540,a:a,l:1})}
      p.ft=p.fr;
    }
  }
  bu.forEach((b,i)=>{b.x+=b.vx*dt;b.y+=b.vy*dt;b.l-=dt;en.forEach(e=>{if(Math.hypot(b.x-e.x,b.y-e.y)<e.r+8){e.hp-=p.d;b.l=0;ft.push({x:e.x,y:e.y-15,tx:Math.round(p.d),c:"#4ade80",l:.6});for(let j=0;j<5;j++)pt.push({x:b.x,y:b.y,vx:(Math.random()-.5)*180,vy:(Math.random()-.5)*180,l:.3,c:"#4ade80"})}});if(b.l<=0)bu.splice(i,1)});
  for(let i=en.length-1;i>=0;i--){
    let e=en[i],a=Math.atan2(p.y-e.y,p.x-e.x);e.x+=Math.cos(a)*e.sp*dt;e.y+=Math.sin(a)*e.sp*dt;
    if(p.au>0&&Math.hypot(p.x-e.x,p.y-e.y)<70+p.au*20)e.hp-=p.d*p.au*dt;
    if(Math.hypot(p.x-e.x,p.y-e.y)<18+e.r){p.hp-=(e.b?28:14)*dt;if(p.hp<=0){alert("SAVAŞ BİTTİ! Skor: "+kl);location.reload();return}}
    if(e.hp<=0){kl++;ge.push({x:e.x,y:e.y,v:e.b?20:2});for(let j=0;j<10;j++)pt.push({x:e.x,y:e.y,vx:(Math.random()-.5)*220,vy:(Math.random()-.5)*220,l:.4,c:e.b?"#38bdf8":"#a3e635"});en.splice(i,1)}
  }
  for(let i=ge.length-1;i>=0;i--){let g=ge[i],d=Math.hypot(p.x-g.x,p.y-g.y);if(d<140){let a=Math.atan2(p.y-g.y,p.x-g.x);g.x+=Math.cos(a)*360*dt;g.y+=Math.sin(a)*360*dt}if(d<24){p.xp+=g.v;ge.splice(i,1);if(p.xp>=p.nx){p.xp=0;p.l++;p.nx=Math.round(p.nx*1.35);lvlMenu();return}}}
  pt.forEach((q,i)=>{q.x+=q.vx*dt;q.y+=q.vy*dt;if((q.l-=dt)<=0)pt.splice(i,1)});
  ft.forEach((f,i)=>{f.y-=35*dt;if((f.l-=dt)<=0)ft.splice(i,1)});

  document.getElementById("lv").innerText="⭐ Lv."+p.l;
  document.getElementById("rd").innerText="Round "+(Math.floor(t/20)+1);
  document.getElementById("sc").innerText="💀 "+kl;
  document.getElementById("hp-fill").style.width=(p.hp/p.mhp*100)+"%";
  document.getElementById("xp-fill").style.width=(p.xp/p.nx*100)+"%";

  x.fillStyle="#1a2418";x.fillRect(0,0,W,H);
  x.save();x.translate(W/2-p.x,H/2-p.y);
  let gs=80;
  for(let gx=Math.floor((p.x-W/2)/gs)*gs;gx<p.x+W/2+gs;gx+=gs){
    for(let gy=Math.floor((p.y-H/2)/gs)*gs;gy<p.y+H/2+gs;gy+=gs){
      x.fillStyle=((gx+gy)/gs)%2==0?"#1f2b1c":"#192317";x.fillRect(gx,gy,gs-2,gs-2);
    }
  }
  if(p.au>0){x.beginPath();x.arc(p.x,p.y,70+p.au*20,0,6.28);x.fillStyle="rgba(74,222,128,.12)";x.fill();x.strokeStyle="#4ade80";x.lineWidth=2;x.stroke();}
  ge.forEach(g=>{x.fillStyle="#34d399";x.beginPath();x.moveTo(g.x,g.y-7);x.lineTo(g.x+6,g.y);x.lineTo(g.x,g.y+7);x.lineTo(g.x-6,g.y);x.fill();});
  en.forEach(drawMob);
  bu.forEach(b=>{x.save();x.translate(b.x,b.y);x.rotate(b.a);x.fillStyle="#4ade80";x.beginPath();x.arc(0,0,12,-0.8,0.8);x.lineWidth=5;x.strokeStyle="#bbf7d0";x.stroke();x.restore();});
  drawHero(p.x,p.y,p.dir);
  pt.forEach(q=>{x.fillStyle=q.c;x.fillRect(q.x-3,q.y-3,6,6)});
  x.font="900 15px sans-serif";x.textAlign="center";
  ft.forEach(f=>{x.fillStyle="#000";x.fillText(f.tx,f.x+1,f.y+1);x.fillStyle=f.c;x.fillText(f.tx,f.x,f.y)});
  x.restore();
