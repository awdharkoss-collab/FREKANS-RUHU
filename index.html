<!DOCTYPE html>
<html lang="tr">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Zindan Şövalyesi</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none}body{background:#0b110d;color:#fff;font-family:sans-serif;overflow:hidden;touch-action:none}
canvas{display:block;width:100vw;height:100vh}
.ov{position:fixed;inset:0;background:rgba(8,12,18,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;z-index:99;text-align:center}
.hid{display:none!important}
.row{display:flex;gap:10px;margin:16px 0;flex-wrap:wrap;justify-content:center}
.hc{background:#1e293b;border:3px solid #475569;border-radius:14px;padding:14px;width:155px;cursor:pointer}
.hc.sel{border-color:#fbbf24;box-shadow:0 0 18px rgba(251,191,36,.4)}
.btn{background:#d97706;border:2px solid #fef08a;color:#fff;padding:14px 36px;font-size:19px;font-weight:900;border-radius:12px;cursor:pointer}
</style></head>
<body>
<div id="st" class="ov">
  <h1 style="color:#fbbf24">⚔️ ZİNDAN ŞÖVALYESİ</h1>
  <div class="row">
    <div class="hc sel" id="h0" onclick="selH(0)"><div style="font-size:34px">⚡</div><b>Yıldırım Lordu</b><p style="font-size:11px;color:#94a3b8">Çekiç & Şimşek</p></div>
    <div class="hc" id="h1" onclick="selH(1)"><div style="font-size:34px">🤖</div><b>Plazma Zırhı</b><p style="font-size:11px;color:#94a3b8">Hızlı Lazer Işını</p></div>
    <div class="hc" id="h2" onclick="selH(2)"><div style="font-size:34px">🗡️</div><b>Zümrüt Şövalye</b><p style="font-size:11px;color:#94a3b8">Dev Kılıç & Zırh</p></div>
  </div>
  <button class="btn" id="go">SAVAŞA GİR</button>
</div>
<div id="lu" class="ov hid"><h2 style="color:#fbbf24">✨ YETENEK SEÇ</h2><div class="row" id="cb"></div></div>
<canvas id="c"></canvas>
<script>
const c=document.getElementById("c"),x=c.getContext("2d");let W=c.width=innerWidth,H=c.height=innerHeight;
onresize=()=>{W=c.width=innerWidth;H=c.height=innerHeight};
let ht=0,p,en=[],bu=[],ge=[],pt=[],ft=[],k={},joy={a:0,sx:0,sy:0,dx:0,dy:0},t=0,lt=0,st=0,bt=0,kl=0,run=0,an=0;
function selH(n){ht=n;[0,1,2].forEach(i=>document.getElementById("h"+i).className=i==n?"hc sel":"hc")}
onkeydown=e=>k[e.key.toLowerCase()]=1;onkeyup=e=>k[e.key.toLowerCase()]=0;
c.ontouchstart=e=>{let q=e.touches.item(0);if(q)joy={a:1,sx:q.clientX,sy:q.clientY,dx:0,dy:0}};
c.ontouchmove=e=>{let q=e.touches.item(0);if(joy.a&&q){let vx=q.clientX-joy.sx,vy=q.clientY-joy.sy,d=Math.hypot(vx,vy);if(d>0){let cl=Math.min(d,45);joy.dx=vx/d*(cl/45);joy.dy=vy/d*(cl/45)}}};
c.ontouchend=()=>joy.a=0;
document.getElementById("go").onclick=()=>{
  document.getElementById("st").classList.add("hid");
  p={x:0,y:0,hp:ht==2?140:100,mhp:ht==2?140:100,s:ht==1?250:220,l:1,xp:0,nx:8,fr:ht==1?.4:.55,ft:0,d:ht==2?34:28,m:1,au:0,dir:0};
  en=[];bu=[];ge=[];pt=[];ft=[];t=0;st=0;bt=0;kl=0;run=1;lt=performance.now();requestAnimationFrame(lp);
};
function lvl(){
  run=0;const b=document.getElementById("cb");b.innerHTML="";
  [{i:"m",t:"⚔️ +1 Silah"},{i:"s",t:"⚡ Hız +%25"},{i:"d",t:"🔥 Hasar +%35"},{i:"a",t:"🌀 Plazma Aura"},{i:"h",t:"🧪 +45 Max Can"}].sort(()=>Math.random()-.5).slice(0,3).forEach(u=>{
    let d=document.createElement("div");d.className="hc";d.innerHTML=`<b>${u.t}</b>`;
    d.onclick=()=>{if(u.i=="m")p.m++;if(u.i=="s")p.fr*=.75;if(u.i=="d")p.d*=1.35;if(u.i=="a")p.au++;if(u.i=="h"){p.mhp+=45;p.hp=p.mhp}
    document.getElementById("lu").classList.add("hid");run=1;lt=performance.now();requestAnimationFrame(lp)};b.appendChild(d);
  });document.getElementById("lu").classList.remove("hid");
}
function lp(n){
  if(!run)return;let dt=Math.min(.05,(n-lt)/1e3);lt=n;t+=dt;an+=dt*9;
  let mx=joy.a?joy.dx:(k.d||k.arrowright?1:0)-(k.a||k.arrowleft?1:0),my=joy.a?joy.dy:(k.s||k.arrowdown?1:0)-(k.w||k.arrowup?1:0),ln=Math.hypot(mx,my);
  if(ln){p.x+=mx/Math.max(1,ln)*p.s*dt;p.y+=my/Math.max(1,ln)*p.s*dt;p.dir=Math.atan2(my,mx)}
  if((st-=dt)<=0){let a=Math.random()*6.28,d=Math.max(W,H)*.6;en.push({x:p.x+Math.cos(a)*d,y:p.y+Math.sin(a)*d,r:16,hp:35+t*.7,mhp:35+t*.7,sp:95,b:0,fl:0});st=Math.max(.22,.95-t*.01)}
  if((bt+=dt)>=30){bt=0;let a=Math.random()*6.28,d=Math.max(W,H)*.6;en.push({x:p.x+Math.cos(a)*d,y:p.y+Math.sin(a)*d,r:36,hp:550+t*6,mhp:550+t*6,sp:65,b:1,fl:0});ft.push({x:p.x,y:p.y-50,tx:"⚠️ RÜNLÜ GOLEM BOSS!",c:"#38bdf8",l:1.5})}
  if((p.ft-=dt)<=0&&en.length){
    let nr=en.reduce((a,b)=>Math.hypot(b.x-p.x,b.y-p.y)<Math.hypot(a.x-p.x,a.y-p.y)?b:a);
    if(Math.hypot(nr.x-p.x,nr.y-p.y)<540){
      let ba=Math.atan2(nr.y-p.y,nr.x-p.x);p.dir=ba;
      for(let i=0;i<p.m;i++){let a=ba+(i-(p.m-1)/2)*.18;bu.push({x:p.x,y:p.y,vx:Math.cos(a)*580,vy:Math.sin(a)*580,a:a,rot:0,l:1})}
      if(ht==0&&Math.random()<.45){nr.hp-=p.d*1.4;nr.fl=.12;ft.push({x:nr.x,y:nr.y-24,tx:"⚡"+Math.round(p.d*1.4),c:"#38bdf8",l:.7})}
      p.ft=p.fr;
    }
  }
  bu.forEach((b,i)=>{b.x+=b.vx*dt;b.y+=b.vy*dt;b.rot+=dt*20;b.l-=dt;en.forEach(e=>{if(Math.hypot(b.x-e.x,b.y-e.y)<e.r+10){e.hp-=p.d;e.fl=.1;b.l=0;ft.push({x:e.x,y:e.y-15,tx:Math.round(p.d),c:ht==0?"#38bdf8":ht==1?"#f87171":"#4ade80",l:.6})}});if(b.l<=0)bu.splice(i,1)});
  for(let i=en.length-1;i>=0;i--){
    let e=en[i];if(e.fl>0)e.fl-=dt;let a=Math.atan2(p.y-e.y,p.x-e.x);e.x+=Math.cos(a)*e.sp*dt;e.y+=Math.sin(a)*e.sp*dt;
    if(p.au>0&&Math.hypot(p.x-e.x,p.y-e.y)<75+p.au*22)e.hp-=p.d*p.au*dt*1.2;
    if(Math.hypot(p.x-e.x,p.y-e.y)<18+e.r){p.hp-=(e.b?28:14)*dt;if(p.hp<=0){alert("SAVAŞ BİTTİ! Skor: "+kl);location.reload();return}}
    if(e.hp<=0){kl++;ge.push({x:e.x,y:e.y,v:e.b?25:2,b:e.b});en.splice(i,1)}
  }
  for(let i=ge.length-1;i>=0;i--){let g=ge[i],d=Math.hypot(p.x-g.x,p.y-g.y);if(d<150){let a=Math.atan2(p.y-g.y,p.x-g.x);g.x+=Math.cos(a)*380*dt;g.y+=Math.sin(a)*380*dt}if(d<24){p.xp+=g.v;ge.splice(i,1);if(p.xp>=p.nx){p.xp=0;p.l++;p.nx=Math.round(p.nx*1.35);lvl();return}}}
  ft.forEach((f,i)=>{f.y-=38*dt;if((f.l-=dt)<=0)ft.splice(i,1)});
  x.fillStyle="#141e16";x.fillRect(0,0,W,H);x.save();x.translate(W/2-p.x,H/2-p.y);
  for(let gx=Math.floor((p.x-W/2)/80)*80;gx<p.x+W/2+80;gx+=80)for(let gy=Math.floor((p.y-H/2)/80)*80;gy<p.y+H/2+80;gy+=80){x.fillStyle=((gx+gy)/80)%2==0?"#1c2a1e":"#172219";x.fillRect(gx,gy,78,78)}
  if(p.au>0){x.beginPath();x.arc(p.x,p.y,75+p.au*22,0,6.28);x.fillStyle="rgba(56,189,248,.12)";x.fill();x.strokeStyle="#38bdf8";x.stroke()}
  ge.forEach(g=>{x.fillStyle=g.b?"#fbbf24":"#34d399";x.beginPath();x.arc(g.x,g.y,g.b?8:5,0,6.28);x.fill()});
  en.forEach(e=>{x.save();x.translate(e.x,e.y);let s=e.b?2.3:1.1;x.scale(s,s);x.fillStyle=e.fl>0?"#fff":e.b?"#1e293b":"#3f6212";x.beginPath();x.arc(0,0,14,0,6.28);x.fill();x.strokeStyle=e.b?"#38bdf8":"#1a2e05";x.lineWidth=2;x.stroke();x.fillStyle=e.b?"#38bdf8":"#ef4444";x.fillRect(-6,-4,4,4);x.fillRect(2,-4,4,4);x.restore();if(e.b){x.fillStyle="#000";x.fillRect(e.x-35,e.y-45,70,7);x.fillStyle="#ef4444";x.fillRect(e.x-35,e.y-45,70*(e.hp/e.mhp),7)}});
  bu.forEach(b=>{x.save();x.translate(b.x,b.y);if(ht==0){x.rotate(b.rot);x.fillStyle="#94a3b8";x.strokeStyle="#38bdf8";x.fillRect(-8,-6,16,12);x.strokeRect(-8,-6,16,12)}else if(ht==1){x.rotate(b.a);x.fillStyle="#ef4444";x.fillRect(-14,-3,28,6)}else{x.rotate(b.a);x.strokeStyle="#4ade80";x.lineWidth=5;x.beginPath();x.arc(0,0,14,-.8,.8);x.stroke()}x.restore()});
  let bob=Math.sin(an)*2.5;x.save();x.translate(p.x,p.y);
  x.fillStyle=ht==0?"#dc2626":ht==1?"#b91c1c":"#065f46";x.beginPath();x.arc(0,4+bob,15,0,6.28);x.fill();
  x.fillStyle=ht==0?"#fde68a":ht==1?"#fbbf24":"#fed7aa";x.beginPath();x.arc(0,-10+bob,11,0,6.28);x.fill();
  x.rotate(p.dir);x.fillStyle=ht==0?"#38bdf8":ht==1?"#ef4444":"#4ade80";x.fillRect(10,-4,22,8);x.restore();
  x.font="900 15px sans-serif";x.textAlign="center";ft.forEach(f=>{x.fillStyle=f.c;x.fillText(f.tx,f.x,f.y)});x.restore();
  x.fillStyle="#fff";x.font="900 15px sans-serif";x.fillText(`⭐ Lv.${p.l} | ❤️ ${Math.ceil(p.hp)}/${p.mhp} | Round ${Math.floor(t/20)+1} | 💀 ${kl}`,16,28);
  requestAnimationFrame(lp);
}
</script></body></html>
