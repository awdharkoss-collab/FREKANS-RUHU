<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Zindan Şövalyesi</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body { background: #090a0f; color: #f1f5f9; font-family: sans-serif; overflow: hidden; }
  canvas { position: fixed; inset: 0; z-index: 1; }
  #hud { position: fixed; top: 0; left: 0; width: 100%; padding: 12px 16px; pointer-events: none; z-index: 5; }
  .top-row { display: flex; justify-content: space-between; font-weight: bold; font-size: 15px; margin-bottom: 8px; }
  .badge { background: rgba(15, 23, 42, 0.85); border: 1px solid #334155; padding: 5px 12px; border-radius: 20px; }
  .xp-wrap { width: 100%; height: 12px; background: #1e293b; border-radius: 10px; overflow: hidden; }
  #xp-bar { width: 0%; height: 100%; background: #10b981; }
  .overlay { position: fixed; inset: 0; background: rgba(5, 7, 12, 0.92); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; z-index: 999; text-align: center; }
  .hidden { display: none !important; }
  h1 { font-size: 34px; color: #f59e0b; margin-bottom: 10px; }
  p.sub { color: #94a3b8; max-width: 420px; margin-bottom: 24px; }
  .btn { background: #d97706; color: #fff; border: none; padding: 16px 40px; font-size: 18px; font-weight: bold; border-radius: 12px; cursor: pointer; z-index: 1000; }
  .btn:hover { background: #f59e0b; }
  .cards { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; margin-top: 16px; }
  .card { background: #1e293b; border: 2px solid #475569; border-radius: 14px; padding: 18px; width: 210px; cursor: pointer; }
  .card:hover { border-color: #f59e0b; }
</style>
</head>
<body>
<div id="hud">
  <div class="top-row">
    <div class="badge" id="lvl-txt">⚔️ Sv. 1</div>
    <div class="badge" id="time-txt">⏱️ 00:00</div>
    <div class="badge" id="kill-txt">💀 0</div>
  </div>
  <div class="xp-wrap"><div id="xp-bar"></div></div>
</div>
<div id="start-screen" class="overlay">
  <h1>⚔️ ZİNDAN ŞÖVALYESİ</h1>
  <p class="sub">Karanlık zindanda hayatta kal! İskelet ordularını biç ve güçlen.</p>
  <button type="button" class="btn" onclick="start()">ZİNDANA GİR</button>
</div>
<div id="levelup-screen" class="overlay hidden">
  <h1>✨ SEVİYE ATLADIN!</h1>
  <div class="cards" id="card-container"></div>
</div>
<div id="gameover-screen" class="overlay hidden">
  <h1 style="color:#ef4444;">💀 ŞÖVALYE DÜŞTÜ</h1>
  <p class="sub" id="final-stats"></p>
  <button type="button" class="btn" onclick="start()">TEKRAR DENE</button>
</div>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
let W = canvas.width = window.innerWidth, H = canvas.height = window.innerHeight;
window.onresize = () => { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; };

let state = "MENU", player, enemies = [], bullets = [], gems = [], keys = {};
let joy = { active: false, sx: 0, sy: 0, dx: 0, dy: 0 };
let gameTime = 0, lastTime = 0, spawnTimer = 0, bossTimer = 0, kills = 0;

const UPGRADES = [
  { id: "multi", title: "🗡️ Çoklu Hançer", desc: "+1 ekstra hançer fırlatır" },
  { id: "speed", title: "⚡ Kılıç Hızı", desc: "Saldırı hızını %25 artırır" },
  { id: "dmg", title: "🔥 Alevli Çelik", desc: "Saldırı hasarını %35 artırır" },
  { id: "aura", title: "🛡️ Kutsal Aura", desc: "Yakındaki düşmanları yakan halka açar" },
  { id: "move", title: "🥾 Hızlı Çizme", desc: "Hareket hızını %20 artırır" },
  { id: "heal", title: "🧪 Can İksiri", desc: "+30 Max Can & Canı Doldurur" }
];

window.onkeydown = e => keys[e.key.toLowerCase()] = true;
window.onkeyup = e => keys[e.key.toLowerCase()] = false;

canvas.ontouchstart = e => {
  if (e.touches && e.touches.length > 0) {
    const t = e.touches.item(0);
    joy.active = true; joy.sx = t.clientX; joy.sy = t.clientY; joy.dx = 0; joy.dy = 0;
  }
};
canvas.ontouchmove = e => {
  if (!joy.active || !e.touches || e.touches.length === 0) return;
  const t = e.touches.item(0);
  const vx = t.clientX - joy.sx, vy = t.clientY - joy.sy, d = Math.hypot(vx, vy);
  if (d > 0) { const c = Math.min(d, 50); joy.dx = (vx / d) * (c / 50); joy.dy = (vy / d) * (c / 50); }
};
canvas.ontouchend = () => { joy.active = false; joy.dx = 0; joy.dy = 0; };

function start() {
  document.getElementById("start-screen").classList.add("hidden");
  document.getElementById("gameover-screen").classList.add("hidden");
  document.getElementById("levelup-screen").classList.add("hidden");
  player = { x: 0, y: 0, r: 16, hp: 100, maxHp: 100, speed: 220, lvl: 1, xp: 0, nextXp: 8, fireRate: 0.6, fireTimer: 0, dmg: 25, multi: 1, aura: 0, auraTimer: 0 };
  enemies = []; bullets = []; gems = []; gameTime = 0; spawnTimer = 0; bossTimer = 0; kills = 0;
  state = "PLAY"; lastTime = performance.now();
  requestAnimationFrame(loop);
}

function levelUp() {
  state = "LEVELUP";
  const box = document.getElementById("card-container");
  box.innerHTML = "";
  UPGRADES.slice().sort(() => Math.random() - 0.5).slice(0, 3).forEach(u => {
    const d = document.createElement("div");
    d.className = "card";
    d.innerHTML = `<h3 style="color:#fbbf24">${u.title}</h3><p style="font-size:13px;margin-top:6px">${u.desc}</p>`;
    d.onclick = () => {
      if (u.id === "multi") player.multi++;
      if (u.id === "speed") player.fireRate *= 0.75;
      if (u.id === "dmg") player.dmg *= 1.35;
      if (u.id === "aura") player.aura++;
      if (u.id === "move") player.speed *= 1.2;
      if (u.id === "heal") { player.maxHp += 30; player.hp = player.maxHp; }
      document.getElementById("levelup-screen").classList.add("hidden");
      state = "PLAY"; lastTime = performance.now(); requestAnimationFrame(loop);
    };
    box.appendChild(d);
  });
  document.getElementById("levelup-screen").classList.remove("hidden");
}

function loop(now) {
  if (state !== "PLAY") return;
  const dt = Math.min(0.05, (now - lastTime) / 1000); lastTime = now; gameTime += dt;

  let mx = 0, my = 0;
  if (keys["w"] || keys["arrowup"]) my--;
  if (keys["s"] || keys["arrowdown"]) my++;
  if (keys["a"] || keys["arrowleft"]) mx--;
  if (keys["d"] || keys["arrowright"]) mx++;
  if (joy.active) { mx = joy.dx; my = joy.dy; }
  const l = Math.hypot(mx, my);
  if (l > 0) { player.x += (mx / Math.max(1, l)) * player.speed * dt; player.y += (my / Math.max(1, l)) * player.speed * dt; }

  spawnTimer -= dt;
  if (spawnTimer <= 0) {
    const a = Math.random() * Math.PI * 2, dist = Math.max(W, H) * 0.6;
    enemies.push({ x: player.x + Math.cos(a) * dist, y: player.y + Math.sin(a) * dist, r: 14, hp: 30 + gameTime * 0.6, maxHp: 30 + gameTime * 0.6, speed: 95, dmg: 15, boss: false });
    spawnTimer = Math.max(0.25, 1.0 - gameTime * 0.01);
  }
  bossTimer += dt;
  if (bossTimer >= 45) {
    bossTimer = 0;
    const a = Math.random() * Math.PI * 2, dist = Math.max(W, H) * 0.6;
    enemies.push({ x: player.x + Math.cos(a) * dist, y: player.y + Math.sin(a) * dist, r: 32, hp: 400 + gameTime * 5, maxHp: 400 + gameTime * 5, speed: 65, dmg: 30, boss: true });
  }

  if (player.aura > 0) {
    player.auraTimer -= dt;
    if (player.auraTimer <= 0) {
      player.auraTimer = 0.45;
      const ar = 75 + player.aura * 22;
      enemies.forEach(e => { if (Math.hypot(e.x - player.x, e.y - player.y) <= ar + e.r) e.hp -= player.dmg * 0.45 * player.aura; });
    }
  }

  player.fireTimer -= dt;
  if (player.fireTimer <= 0 && enemies.length > 0) {
    let near = enemies, best = 9999;
    enemies.forEach(e => { const d = Math.hypot(e.x - player.x, e.y - player.y); if (d < best) { best = d; near = e; } });
    if (best < 520) {
      const ba = Math.atan2(near.y - player.y, near.x - player.x);
      for (let i = 0; i < player.multi; i++) {
        const a = ba + (i - (player.multi - 1) / 2) * 0.18;
        bullets.push({ x: player.x, y: player.y, vx: Math.cos(a) * 520, vy: Math.sin(a) * 520, life: 1 });
      }
      player.fireTimer = player.fireRate;
    }
  }

  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i]; b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    for (let j = 0; j < enemies.length; j++) {
      const e = enemies[j];
      if (Math.hypot(b.x - e.x, b.y - e.y) < e.r + 6) { e.hp -= player.dmg; b.life = 0; break; }
    }
    if (b.life <= 0) bullets.splice(i, 1);
  }

  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i], a = Math.atan2(player.y - e.y, player.x - e.x);
    e.x += Math.cos(a) * e.speed * dt; e.y += Math.sin(a) * e.speed * dt;
    if (Math.hypot(player.x - e.x, player.y - e.y) < player.r + e.r) {
      player.hp -= e.dmg * dt;
      if (player.hp <= 0) {
        state = "GAMEOVER";
        document.getElementById("final-stats").innerText = `Süre: ${Math.floor(gameTime)} sn | Seviye: ${player.lvl} | Skor: ${kills}`;
        document.getElementById("gameover-screen").classList.remove("hidden"); return;
      }
    }
    if (e.hp <= 0) { kills++; gems.push({ x: e.x, y: e.y, val: e.boss ? 20 : 2, boss: e.boss }); enemies.splice(i, 1); }
  }

  for (let i = gems.length - 1; i >= 0; i--) {
    const g = gems[i], d = Math.hypot(player.x - g.x, player.y - g.y);
    if (d < 130) { const a = Math.atan2(player.y - g.y, player.x - g.x); g.x += Math.cos(a) * 350 * dt; g.y += Math.sin(a) * 350 * dt; }
    if (d < player.r + 10) {
      player.xp += g.val; gems.splice(i, 1);
      if (player.xp >= player.nextXp) { player.xp -= player.nextXp; player.lvl++; player.nextXp = Math.round(player.nextXp * 1.35); levelUp(); return; }
    }
  }

  document.getElementById("lvl-txt").innerText = `⚔️ Sv. ${player.lvl}`;
  document.getElementById("kill-txt").innerText = `💀 ${kills}`;
  document.getElementById("time-txt").innerText = `⏱️ ${String(Math.floor(gameTime/60)).padStart(2,"0")}:${String(Math.floor(gameTime%60)).padStart(2,"0")}`;
